# GoReleaser configuration for termdict.
#
# Release asset layout (consumers depend on these names):
#   - termdict_<tag>_<os>_<arch>.tar.gz|.zip   binaries (archives)
#   - termdict_checksums.txt                   sha256 of the archives
#   - wb1913_*.json, changes_tracker.json      full-database assets
#   - checksums.txt                            sha256 of the database files
#                                              (verified by the app's update
#                                              channel; generated by
#                                              cmd/dbasebuild)
version: 2

project_name: termdict

builds:
  - id: termdict
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
        -X github.com/yodeman/termdict/internal/config.AppVersion={{ .Tag }}
        -X github.com/yodeman/termdict/internal/config.Commit={{ .FullCommit }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  # Distinct from the data checksums.txt uploaded as a release extra file.
  name_template: "termdict_checksums.txt"

changelog:
  disable: true # CHANGELOG.md is maintained by hand (docs phase)

release:
  draft: true
  mode: append
  header: |
    ## TermDict {{ .Tag }}

    **Offline by default:** every binary ships with an embedded core dictionary.
    `Download Full Dictionary` / `termdict download` adds the complete word list.

    Thanks for trying TermDict! Report issues at https://github.com/yodeman/termdict/issues
  extra_files:
    - glob: word_dbase/json/wb1913_*.json
    - glob: word_dbase/checksums.txt
    - glob: word_dbase/changes_tracker.json

# Pull-request / push quality gates.
#
# The lint job (golangci-lint) also enforces gofmt via the gofmt
# formatter enabled in .golangci.yml, so a separate fmt check is not
# needed. Go versions track the two currently-supported releases.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race detector)
        run: go test -race ./...

  lint:
    # Single linux job: golangci-lint results are OS-independent for
    # this codebase and the action is slow enough that a 6x matrix
    # would triple CI time for no signal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  e2e:
    # CLI end-to-end contract (exit codes, piping) on the fastest runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: CLI end-to-end checks
        run: sh scripts/cli_e2e.sh

  sh-install-smoke:
    # Proves the documented piped one-liner grammar end-to-end:
    # "cat install.sh | sh -s -- --from-dir dist --version <ver>" against a
    # goreleaser snapshot (no network downloads).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build snapshot archives
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest 2>&1 | tail -1
          ~/go/bin/goreleaser release --snapshot --clean --timeout 10m
      - name: Piped install → verify → uninstall
        run: |
          set -eu
          name=$(basename "$(ls dist/termdict_v*_linux_amd64.tar.gz | head -1)" .tar.gz)
          ver=${name#termdict_}; ver=${ver%_linux_amd64}
          cat install.sh | sh -s -- --from-dir dist --version "$ver" --prefix /tmp/td-prefix
          /tmp/td-prefix/termdict --version
          sh install.sh --prefix /tmp/td-prefix uninstall
          [ ! -f /tmp/td-prefix/termdict ]

  windows-install-smoke:
    # Runtime smoke for install.ps1 invoked exactly like the documented
    # one-liner (requirement R3): real code paths, session survival, no
    # scope pollution — not just a syntax parse.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build binary
        run: go build -o termdict.exe .
      - name: Runtime smoke (install → verify → uninstall)
        shell: pwsh
        run: ./scripts/smoke_install.ps1 -InstallScript install.ps1 -ExeSource termdict.exe
